<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Linktree</title>
    <style>
        body { background: #f4f4f6; color: #111111; font-family: sans-serif; display: flex; justify-content: center; padding: 40px 20px; }
        .container { width: 100%; max-width: 500px; text-align: center; }
        h1 { font-size: 22px; margin-bottom: 30px; }
        .form-container { background: #ffffff; padding: 20px; border: 1px solid #e1e1e6; border-radius: 12px; margin-bottom: 30px; text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #cccccc; border-radius: 6px; box-sizing: border-box; }
        .submit-btn { width: 100%; background: #000000; color: white; padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .submit-btn:hover { background: #222222; }
        
        /* Estilos para la lista de gestión */
        .admin-links-list { display: flex; flex-direction: column; gap: 10px; text-align: left; margin-top: 20px; }
        .admin-link-item { background: white; padding: 12px 16px; border-radius: 8px; border: 1px solid #e1e1e6; display: flex; justify-content: space-between; align-items: center; }
        .link-info { font-weight: 600; font-size: 14px; }
        .delete-btn { background: #ff3b30; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .delete-btn:hover { background: #cc2d24; }

        .back-btn { display: inline-block; margin-top: 30px; color: #666666; text-decoration: none; font-size: 14px; }
        .back-btn:hover { color: #000000; }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚙️ Panel de Control Privado</h1>
        
        <div class="form-container">
            <form action="/api/enlaces" method="POST">
                <div class="form-group">
                    <label>Título del Botón:</label>
                    <input type="text" name="titulo" placeholder="Ej: Mi Instagram" required>
                </div>
                <div class="form-group">
                    <label>Enlace (URL):</label>
                    <input type="url" name="url" placeholder="Ej: https://instagram.com/..." required>
                </div>
                <button type="submit" class="submit-btn">Añadir Enlace al NFC ➕</button>
            </form>
        </div>

        <h3>Tus enlaces activos actuales:</h3>
        <div id="lista-gestion-enlaces" class="admin-links-list"></div>

        <a href="/" class="back-btn">← Ver vista del cliente (NFC)</a>
    </div>

    <script>
        // Pedimos los enlaces actuales para dibujar la lista con sus botones de borrado
        fetch('/api/enlaces')
            .then(respuesta => respuesta.json())
            .then(enlaces => {
                const lista = document.getElementById('lista-gestion-enlaces');
                
                enlaces.forEach((enlace, index) => {
                    const item = document.createElement('div');
                    item.className = 'admin-link-item';
                    
                    // Metemos un mini-formulario invisible por cada botón para poder enviar el ID al servidor al hacer clic
                    item.innerHTML = `
                        <span class="link-info">${enlace.titulo}</span>
                        <form action="/api/eliminar-enlace" method="POST" style="margin:0;">
                            <input type="hidden" name="id" value="${index}">
                            <button type="submit" class="delete-btn">Eliminar 🗑️</button>
                        </form>
                    `;
                    lista.appendChild(item);
                });
            });
    </script>
</body>
</html>
